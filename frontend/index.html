    <script>
      (function () {
        var badge = document.getElementById('htag-badge');
        if (!badge) return;

        function toggleBadgeVisibility() {
          var scrollTop = window.scrollY || window.pageYOffset || 0;
          var viewportBottom = scrollTop + window.innerHeight;
          var footerSection = document.querySelector('footer');
          var documentHeight = Math.max(
            document.body.scrollHeight,
            document.documentElement.scrollHeight
          );
          var canScroll = documentHeight > (window.innerHeight + 120);
          var shouldShow = false;

          if (footerSection) {
            var footerStart = footerSection.offsetTop;
            shouldShow = canScroll && scrollTop > 40 && viewportBottom >= (footerStart - 220);
          } else {
            shouldShow = canScroll && scrollTop >= (window.innerHeight * 1.1);
          }

          if (shouldShow) {
            if (footerSection) {
              var footerDivider = footerSection.querySelector('.border-t');
              var footerTop = footerSection.offsetTop;
              var stopLineTop = footerDivider ? footerDivider.offsetTop : footerTop;
              var stopOffset = 6;
              var fixedBottomOffset = 84;
              var blendZone = 240;
              var distanceToLine = stopLineTop - viewportBottom;
              var dynamicBottom = fixedBottomOffset;

              if (distanceToLine > blendZone) {
                dynamicBottom = fixedBottomOffset;
              } else if (distanceToLine > 0) {
                var progress = 1 - (distanceToLine / blendZone);
                dynamicBottom = fixedBottomOffset + (stopOffset - fixedBottomOffset) * progress;
              } else {
                dynamicBottom = stopOffset + Math.abs(distanceToLine);
              }

              badge.style.setProperty('position', 'fixed', 'important');
              badge.style.setProperty('top', 'auto', 'important');
              badge.style.setProperty('bottom', dynamicBottom + 'px', 'important');
            }

            badge.style.opacity = '1';
            badge.style.visibility = 'visible';
            badge.style.pointerEvents = 'auto';
            badge.style.transform = 'translateY(0)';
          } else {
            badge.style.setProperty('position', 'fixed', 'important');
            badge.style.setProperty('top', 'auto', 'important');
            badge.style.setProperty('bottom', '84px', 'important');
            badge.style.opacity = '0';
            badge.style.visibility = 'hidden';
            badge.style.pointerEvents = 'none';
            badge.style.transform = 'translateY(10px)';
          }
        }

        window.addEventListener('scroll', toggleBadgeVisibility, { passive: true });
        window.addEventListener('resize', toggleBadgeVisibility);
        window.addEventListener('load', toggleBadgeVisibility);
        setTimeout(toggleBadgeVisibility, 600);
        toggleBadgeVisibility();
      })();
    </script>

        <p>
          Léa Beauté est un institut de beauté situé au 7 Rue du Palais de Justice, 50700 Valognes

        </p>

        <h2>Notre équipe</h2>
        <p>
          Léa, fondatrice et responsable de l'institut, est esthéticienne depuis plus de 15 ans.
          Experte en soins visage et conseil beauté personnalisé, elle est accompagnée de Maryssa,
          spécialisée en ongles et extensions de cils, et de Maélise, spécialiste des modelages
          du corps.
        </p>
        <h2>Soins visage Guinot</h2>
        <p>
          L'Hydradermie 1000 est un soin visage professionnel Guinot qui combine l'action de
          courants galvaniques et d'actifs cosmétiques concentrés pour une pénétration optimisée.
          Il s'adapte à tous les types de peau et agit sur l'éclat, le confort et l'hydratation
          dès la première séance, en 45 à 75 minutes. Le Visible Age Reverse est notre soin
          signature anti-âge non invasif de 30 minutes, pour une peau plus lisse, plus tonique
          et plus régulière. L'Age Summum agit simultanément sur les rides, la fermeté, l'éclat
          et l'uniformité du visage, du cou et du décolleté.
        </p>
        <h2>Épilation à la lumière pulsée</h2>
        <p>
          L'épilation à la lumière pulsée est une méthode semi-définitive : 90 à 95 % des poils
          traités sont éliminés durablement en une dizaine de séances. Elle est applicable sur
          toutes les zones — jambes, maillot, aisselles, visage — et convient à la plupart des
          types de peau.
        </p>
        <h2>LPG Endermologie</h2>
        <p>
          Les séances LPG Endermologie Corps utilisent la technologie mécanobiologique pour
          améliorer la qualité de peau et accompagner les objectifs silhouette en 35 à 45 minutes.
        </p>
        <h2>Accompagnement nutrition</h2>
        <p>
          L'accompagnement nutritionnel personnalisé par chrononutrition aide à retrouver un
          équilibre alimentaire durable. Il inclut un bilan initial, un suivi régulier et des
          conseils pratiques adaptés au mode de vie de chaque cliente.
